<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrinho Universal</title>
<meta name="description" content="Organize produtos de diferentes lojas em um carrinho universal, com categorias, preços e conversão de moedas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" data-act="home" aria-label="Carrinho Universal, voltar ao início">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="txt">Carrinho Universal</span>
    </button>
    <label class="search">
      <span class="sr">Buscar</span>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar produtos e categorias" autocomplete="off">
    </label>
    <button class="cartsum" id="cartsum" data-act="cart" title="Abrir carrinho" aria-label="Abrir carrinho">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span class="count" id="sum-count">0 itens</span>
      <span class="chip" id="sum-total">R$ 0,00</span>
    </button>
  </div>
</header>

<main id="app">
  <section id="home" class="wrap">
    <div class="hero">
      <div class="hero-text intro-text">
        <h1>Tudo o que você quer comprar, num lugar só.</h1>
        <p>Crie categorias, cole o link de cada produto e acompanhe quanto vai gastar em cada lista.</p>
        <div class="actions" id="hero-actions">
          <button class="btn btn-primary" data-act="new-cat"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nova categoria</button>
          <button class="btn btn-soft" data-act="new-prod">Adicionar produto</button>
        </div>
      </div>
      <div class="mosaic-frame" id="mosaic-slot"></div>
    </div>
    <div id="home-body"></div>
  </section>
  <section id="catview" class="wrap" hidden></section>
</main>
<footer class="wrap foot" id="foot"></footer>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
